name: fitface
description: A local-first Flutter shopping assistant that overlays a registered face image on a rear camera preview.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  path: ^1.9.0
  uuid: ^4.5.1
  image: ^4.2.0

dev_dependencies:
  camera_platform_interface: ^2.13.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  permission_handler_platform_interface: ^4.3.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/body_types/
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
